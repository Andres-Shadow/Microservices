services:
  # ─────────────────────────────────────────────
  # SHARED DATABASE (PostgreSQL — schema-per-service)
  # ─────────────────────────────────────────────
  database:
    build: ./database/shared_postgres
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────────
  server:
    build: ./services/auth_server
    ports:
      - "9090:9090"
    expose:
      - "9090"
    environment:
      - DATABASE=database
      - DATABASE_PORT=5432
      - DATABASE_USER=devuser
      - DATABASE_PASSWORD=devpassword
      - DATABASE_NAME=appdb
      - DATABASE_SCHEMA=auth
      - NATS_SERVER=nats
      - NATS_SUBJECT=MicroservicesLogs
      - JWT_SECRET=changeme_use_a_strong_secret_in_production
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # LOGS MANAGER SERVICE
  # ─────────────────────────────────────────────
  cliente:
    build: ./services/logs_manager_server
    ports:
      - "9091:9091"
    expose:
      - "9091"
    environment:
      - NATS_SERVER=nats
      - DATABASE=database
      - DATABASE_PORT=5432
      - DATABASE_USER=logsuser
      - DATABASE_PASSWORD=logspassword
      - DATABASE_NAME=appdb
      - DATABASE_SCHEMA=logs
      - PUERTO=9091
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # HEALTH MONITOR SERVICE
  # ─────────────────────────────────────────────
  health_server:
    build: ./services/health_server
    ports:
      - "9092:9092"
    expose:
      - "9092"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=healthuser
      - DB_PASSWORD=healthpassword
      - DB_NAME=appdb
      - DB_SCHEMA=health
      - NATS_SERVER=nats
      - NOTIFICATION_HOST=notification_server
      - NOTIFICATION_PORT=9096
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy
      notification_server:
        condition: service_started

  # ─────────────────────────────────────────────
  # USER PROFILE SERVICE
  # ─────────────────────────────────────────────
  user_profile:
    build: ./services/user_profile_server
    ports:
      - "9094:9094"
    expose:
      - "9094"
    environment:
      - DATABASE=database
      - DATABASE_PORT=5432
      - DATABASE_USER=profileuser
      - DATABASE_PASSWORD=profilepassword
      - DATABASE_NAME=appdb
      - DATABASE_SCHEMA=user_profile
      - NATS_SERVER=nats
      - NATS_SUBJECT=MicroservicesLogs
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # NOTIFICATION SERVICE
  # ─────────────────────────────────────────────
  notification_server:
    build: ./services/notification_server
    ports:
      - "9096:9096"
    expose:
      - "9096"
    environment:
      - DB_NOTIFICATION_HOST=notification_database
      - DB_NOTIFICATION_PORT=3306
      - DB_NOTIFICATION_USER=root
      - DB_NOTIFICATION_PASSWORD=andres_1
      - NATS_SERVER=nats
      - NATS_SUBJECT=MicroservicesLogs
    depends_on:
      nats:
        condition: service_healthy
      notification_database:
        condition: service_healthy

  # Notification server still uses its own MySQL (not yet migrated)
  notification_database:
    image: mysql:8.0
    ports:
      - "3310:3306"
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: notifications
      MYSQL_ROOT_PASSWORD: andres_1
    volumes:
      - notification_db_data:/var/lib/mysql

  # ─────────────────────────────────────────────
  # GATEWAY SERVICE
  # ─────────────────────────────────────────────
  gateway_server:
    build: ./services/gateway_server
    ports:
      - "9095:9095"
    expose:
      - "9095"
    environment:
      - USER_SERVER_HOST=server
      - LOGS_HOST=cliente
      - HEALTH_HOST=health_server
      - USER_PROFILE_HOST=user_profile
      - NOTIFICATION_HOST=notification_server
      - NATS_SERVER=nats
    depends_on:
      - nats
      - user_profile
      - notification_server
      - server
      - cliente
      - health_server

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  jenkins:
    build: ./ci/jenkins
    ports:
      - "6432:8080"
      - "50000:50000"
    environment:
      - USER_SERVER_HOST=server
      - LOGS_HOST=cliente
      - HEALTH_HOST=health_server
      - USER_PROFILE_HOST=user_profile
      - NOTIFICATION_HOST=notification_server

volumes:
  postgres_data:
  notification_db_data:
